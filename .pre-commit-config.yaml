repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^copier\.yaml$
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.35.2
    hooks:
      - id: djlint-reformat-jinja
        files: ^template/.*\.jinja$
        exclude: ^template/(\.github|src)/.*\.jinja$
      - id: djlint-jinja
        files: ^template/.*\.jinja$
        exclude: ^template/(\.github|src)/.*\.jinja$

  - repo: local
    hooks:
      - id: verify-truths
        name: Verify Hexagonal Truths Quad-Plane Gate
        entry: python3 scripts/verify_truths.py
        language: system
        files: ^(architecture/rules/hexagonal_truths\.yaml|template/.*)$
        pass_filenames: false

    summary: "Data crossing port boundaries must use immutable DTOs, frozen dataclasses, or primitives, forbidding entity leakage or ORM tunneling."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_port_signatures_use_pure_dtos_and_primitives"

schema_version: "0.1.0"

enforcement_catalog:
  import_linter:
    description: "Static import graph contracts via .importlinter"
    config_file: "template/.importlinter"
  pytest_archon:
    description: "Fluent architectural layer assertion tests"
    test_dir: "template/tests/architecture"
  ast_visitor:
    description: "AST visitor script detecting unauthorized syntax or calls"
    script_dir: "template/scripts"
  runtime_reflection:
    description: "Runtime boundary introspection eliminating object tunneling"
    helper_path: "template/tests/helpers/boundary_reflection.py"
  strict_typing:
    description: "Mypy strict structural subtyping and protocol compliance"
    config_file: "template/pyproject.toml.jinja"

truths:
  - id: "HEXA-TRUTH-01"
    name: "Pure Core Domain Isolation"
    summary: "The core domain must never import external infrastructure, databases, frameworks, or driving adapters."
    enforcements:
      - mechanism: "import_linter"
        contract_name: "core_domain_isolation"
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_core_domain_has_zero_external_dependencies"
    planned_enforcements:
      - mechanism: "ast_visitor"
        name: "configurable_stdlib_domain_allowlist"
        priority: "medium"
        status: "planned"
        description: "Enforce standard library imports exclusively in core/domain, supporting configurable opt-ins via pyproject.toml."
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-01"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-01"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_core_domain_has_zero_external_dependencies"

  - id: "HEXA-TRUTH-02"
    name: "Inward Dependency Direction"
    summary: "Dependencies must only point inward toward the domain; adapters depend on ports, never vice versa."
    enforcements:
      - mechanism: "import_linter"
        contract_name: "inward_dependency_direction"
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_dependencies_point_strictly_inward"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-02"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-02"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_dependencies_point_strictly_inward"

  - id: "HEXA-TRUTH-03"
    name: "Port Abstraction & Protocol Integrity"
    summary: "Ports must be defined as abstract contracts (typing.Protocol or abc.ABC); adapters satisfy them without transport leakage."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_ports_are_abstract_protocols_or_abcs"
    planned_enforcements:
      - mechanism: "ast_visitor"
        name: "strict_port_import_whitelist"
        priority: "high"
        status: "planned"
        description: "Restrict imports in core/ports to typing, abc, collections.abc, stdlib primitives, and core.domain."
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-03"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-03"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_ports_are_abstract_protocols_or_abcs"

  - id: "HEXA-TRUTH-04"
    name: "DTO & Anti-Tunneling Boundary Purity"
    summary: "Data crossing port boundaries must use immutable DTOs, frozen dataclasses, or primitives, forbidding entity leakage or ORM tunneling."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_port_signatures_use_pure_dtos_and_primitives"
    planned_enforcements:
      - mechanism: "ast_visitor"
        name: "anti_tunneling_orm_base_scanner"
        priority: "high"
        status: "planned"
        description: "Inspect port method signatures to explicitly forbid ORM classes (DeclarativeBase, SQLModel, etc.)."
      - mechanism: "ast_visitor"
        name: "dto_immutability_enforcer"
        priority: "medium"
        status: "planned"
        description: "Verify boundary DTO classes use @dataclass(frozen=True) or NamedTuple."
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-04"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-04"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_port_signatures_use_pure_dtos_and_primitives"


  - id: "HEXA-TRUTH-05"
    name: "Zero Lifecycle Pollution in Domain"
    summary: "Domain entities and use cases must never control execution lifecycles, threads, event loops, or signal handlers."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_and_use_cases_have_zero_lifecycle_pollution"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-05"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-05"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_and_use_cases_have_zero_lifecycle_pollution"

  - id: "HEXA-TRUTH-06"
    name: "Domain-to-Port Isolation"
    summary: "The core domain must never import ports or use cases; entities know nothing of boundary ports or orchestration."
    enforcements:
      - mechanism: "import_linter"
        contract_name: "domain_port_isolation"
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_never_imports_ports_or_use_cases"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-06"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-06"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_never_imports_ports_or_use_cases"

  - id: "HEXA-TRUTH-07"
    name: "Business Exception Sovereignty"
    summary: "Domain exceptions must inherit from a pure root DomainError and never catch or wrap infrastructure exceptions."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_exceptions_inherit_from_domain_error"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-07"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-07"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_exceptions_inherit_from_domain_error"

  - id: "HEXA-TRUTH-08"
    name: "Zero Global Mutable State in Domain"
    summary: "The core domain must never declare mutable module-level collections, caches, or singletons."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_has_zero_global_mutable_state"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-08"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-08"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_has_zero_global_mutable_state"

  - id: "HEXA-TRUTH-09"
    name: "Pure In-Memory Determinism"
    summary: "Domain logic must be deterministic and pure, never accessing ambient environment variables (os.environ) or unsanctioned system state."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_has_zero_ambient_environment_access"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-09"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-09"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_has_zero_ambient_environment_access"

  - id: "HEXA-TRUTH-10"
    name: "Self-Validating Entity Invariants"
    summary: "Domain entities and value objects must enforce their own validity at instantiation and never exist in an invalid state."
    enforcements:
      - mechanism: "pytest_archon"
        test_file: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_entities_are_self_validating"
    documentation:
      path: "template/docs/reference/hexagonal_rules.md"
      anchor: "HEXA-TRUTH-10"
    agent_skill:
      path: "template/.gemini/rules/hexagonal_invariants.md"
      anchor: "HEXA-TRUTH-10"
    verification_tests:
      - path: "template/tests/architecture/test_boundaries.py"
        test_function: "test_domain_entities_are_self_validating"
